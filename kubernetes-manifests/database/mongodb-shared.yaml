apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-shared
  namespace: hipster
spec:
  selector:
    matchLabels:
      app: mongodb-shared
  template:
    metadata:
      labels:
        app: mongodb-shared
    spec:
      containers:
      - name: mongodb
        image: mongo:6.0
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-shared
  namespace: hipster
spec:
  selector:
    app: mongodb-shared
  ports:
  - port: 27017
    targetPort: 27017
