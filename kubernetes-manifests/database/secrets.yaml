apiVersion: v1
kind: Secret
metadata:
  namespace: hipster
  name: mongodb-root
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: mongoadmin
  MONGO_ROOT_PASSWORD: mongoadminpass

