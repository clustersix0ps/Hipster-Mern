apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: hipster
  name: recommendation-route
  labels:
    app: recommendationservice
spec:
  parentRefs:
    - name: hipstershop-gateway
  rules:
    # GET /api/recommendations -> recommendationservice /recommendation/
    # (service mounts routes at /recommendation, handler is at GET /)
    - matches:
        - path:
            type: PathPrefix
            value: /api/recommendations
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /recommendation
      backendRefs:
        - name: recommendationservice
          port: 8080
