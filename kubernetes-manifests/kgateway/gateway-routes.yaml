apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hipster-gateway
  namespace: hipster
spec:
  gatewayClassName: kgateway
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: hipster
spec:
  parentRefs:
  - name: hipster-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/"
    backendRefs:
    - name: frontend
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-routes
  namespace: hipster
spec:
  parentRefs:
  - name: hipster-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/api/products"
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: "/products"
    backendRefs:
    - name: productcatalogservice
      port: 3550
  - matches:
    - path:
        type: PathPrefix
        value: "/api/cart"
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: "/cart"
    backendRefs:
    - name: cartservice
      port: 7070
  - matches:
    - path:
        type: PathPrefix
        value: "/api/auth"
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: "/auth"
    backendRefs:
    - name: authservice
      port: 4000
