apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: mern-db
spec:
  serviceName: "redis-master"
  replicas: 1
  selector:
    matchLabels:
      app: redis-master
  template:
    metadata:
      labels:
        app: redis-master
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: mern-db
spec:
  ports:
  - port: 6379
  selector:
    app: redis-master
